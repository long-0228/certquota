[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certquota"
version = "0.2.0"
description = "Strict endpoint verifier and solve-verify-repair pipeline for sparse reciprocal transport"
authors = [{ name = "Long Li", email = "lilong0228@gmail.com" }]
readme = { file = "README.md", content-type = "text/markdown" }
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
  "convex optimization",
  "reciprocal transport",
  "verified numerics",
  "federated learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.scripts]
certquota-verify = "certquota.replay:main"

[project.urls]
Homepage = "https://long-0228.github.io/certquota/"
Repository = "https://github.com/long-0228/certquota"

[project.optional-dependencies]
research = [
  "pandas>=2.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]
benchmark = [
  "cvxpy>=1.4",
  "pyamg>=5.0",
  "python-flint>=0.9",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
release = [
  "build>=1.2",
  "twine>=5.0",
]
mmfl = [
  "torch>=2.1",
  "torchvision>=0.16",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
