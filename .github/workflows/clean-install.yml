name: Clean installed-wheel verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - name: Build, install, test outside checkout import path
        run: python research/a45/clean_wheel_check.py --output results/clean-${{ matrix.os }}
      - name: Retain exact platform, wheel, test and witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-${{ matrix.os }}
          path: |
            results/clean-${{ matrix.os }}/*.log
            results/clean-${{ matrix.os }}/*.json
            results/clean-${{ matrix.os }}/dist/*.whl
